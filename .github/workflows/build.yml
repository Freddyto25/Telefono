`name: Compilar Teléfono Pro LZ  on:   push:     branches: ["main", "master"]   pull_request:     branches: ["main", "master"]   workflow_dispatch:  jobs:   build:     name: Compilar y publicar APK     runs-on: ubuntu-latest      steps:       - name: Descargar el código fuente         uses: actions/checkout@v4        - name: Configurar JDK 17         uses: actions/setup-java@v5         with:           distribution: temurin           java-version: "17"           cache: gradle        - name: Configurar Android SDK         uses: android-actions/setup-android@v3        - name: Conceder permisos de ejecución a Gradle Wrapper         run: chmod +x ./gradlew        - name: Compilar APK de depuración         run: ./gradlew assembleDebug --stacktrace        - name: Publicar APK de depuración         uses: actions/upload-artifact@v4         with:           name: TelefonoProLZ-debug           path: app/build/outputs/apk/debug/*.apk           if-no-files-found: error        - name: Compilar APK de lanzamiento         run: ./gradlew assembleRelease --stacktrace        - name: Generar el almacén de claves y firmar el APK de lanzamiento         env:           KEYSTORE_PASSWORD: lzpassword           KEY_PASSWORD: lzpassword         run: |           keytool -genkeypair -v \             -keystore firma_predeterminada.jks \             -keyalg RSA \             -keysize 2048 \             -validity 10000 \             -alias lz-alias \             -storepass "$KEYSTORE_PASSWORD" \             -keypass "$KEY_PASSWORD" \             -dname "CN=TelefonoProLZ, O=LZ"            BUILD_TOOLS_VERSION=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)           APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"            "$APKSIGNER" sign \             --ks firma_predeterminada.jks \             --ks-pass "pass:$KEYSTORE_PASSWORD" \             --ks-key-alias lz-alias \             --key-pass "pass:$KEY_PASSWORD" \             app/build/outputs/apk/release/*.apk        - name: Publicar APK de lanzamiento firmado         uses: actions/upload-artifact@v4         with:           name: TelefonoProLZ-release-firmado           path: app/build/outputs/apk/release/*.apk           if-no-files-found: error `
